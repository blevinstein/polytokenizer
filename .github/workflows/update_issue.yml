name: Update issue

# Responds to @claude mentions in PR and issue comments.
#
# Setup (repo Settings):
# - Secrets and variables > Actions: ANTHROPIC_API_KEY (required).
#   Provider keys (OPENAI_API_KEY, GEMINI_API_KEY, VERTEX_PROJECT_ID,
#   VERTEX_CREDENTIALS, VERTEX_LOCATION) are optional; pass them so Claude
#   can run integration tests when verifying model changes.
# - Actions > General > Workflow permissions: enable
#   "Allow GitHub Actions to create and approve pull requests".

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(yarn build),Bash(yarn test:*),Bash(yarn test),Bash(npx vitest:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"
